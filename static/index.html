<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenSen — Sensitive Data Classifier</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2e3a;
    --text: #e6e8ee;
    --muted: #8a8fa3;
    --accent: #6ea8ff;
    --accent-soft: rgba(110,168,255,0.15);
    --danger: #ff6e6e;
    --ok: #5fd6a0;
    --mono: "SF Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 24px 32px 16px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 32px 64px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type=text], textarea, select {
    width: 100%;
    background: #0d0f15;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 13px;
    font-family: var(--mono);
    resize: vertical;
  }
  textarea { min-height: 220px; line-height: 1.5; }
  .row { margin-bottom: 14px; }
  .row-inline { display: flex; gap: 12px; align-items: center; }
  button {
    background: var(--accent);
    color: #0d0f15;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  #highlighted {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    min-height: 220px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    background: #0d0f15;
  }
  mark {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 3px;
    padding: 0 2px;
    cursor: help;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 10px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 20px; font-size: 11px; background: var(--accent-soft); color: var(--accent); }
  .score-high { color: var(--ok); }
  .score-low { color: #e0c25f; }
  #status { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 16px; }
  #status.error { color: var(--danger); }
  footer { text-align: center; color: var(--muted); font-size: 11px; padding: 20px; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Sen<span>Sen</span> — Sensitive Data Classifier</h1>
  <p>Presidio-powered enterprise sensitive data discovery &amp; classification — demo console</p>
</header>

<main>
  <section class="panel">
    <h2>Đầu vào</h2>
    <div class="row">
      <label for="apiKey">X-API-Key</label>
      <input type="text" id="apiKey" placeholder="dán API key lấy từ /register">
    </div>
    <div class="row">
      <label for="inputText">Văn bản cần quét</label>
      <textarea id="inputText" placeholder="Dán văn bản hợp đồng, email, báo cáo... vào đây">Hợp đồng số HD-2026-0142 ký giữa Công ty A và ông Nguyễn Văn B (email: nguyenvanb@example.com, SĐT: 0912345678).
Mã số thuế doanh nghiệp: 0312345678.
API key nội bộ: sk-live-51Hh8x9AbCdEfGhIjKlMnOpQrStUvWxYz01234567
Database connection string: postgresql://admin:S3cretPass@db.internal:5432/prod
Điều khoản bồi thường vi phạm NDA quy định mức phạt 50,000,000 VND.</textarea>
    </div>
    <div class="row row-inline">
      <button id="scanBtn">Quét dữ liệu nhạy cảm</button>
      <label class="checkbox-row"><input type="checkbox" id="anonymize"> Ẩn danh hoá (anonymize)</label>
      <label class="checkbox-row"><input type="checkbox" id="deepScan"> Deep scan (LLM)</label>
    </div>
    <div class="row" id="deepScanModelRow" style="display:none">
      <label for="deepScanModel">Model (deep scan)</label>
      <select id="deepScanModel"><option value="">— server default —</option></select>
      <div id="deepScanModelStatus" style="font-size:11px;color:var(--muted);margin-top:4px"></div>
    </div>
    <div id="status"></div>
  </section>

  <section class="panel">
    <h2>Kết quả</h2>
    <div id="resultArea" class="empty">Chưa có kết quả — nhấn "Quét dữ liệu nhạy cảm" để bắt đầu.</div>
  </section>
</main>

<footer>SenSen MVP · Microsoft Presidio + FastAPI · dữ liệu chỉ xử lý trong RAM, không lưu trữ</footer>

<script>
const scanBtn = document.getElementById('scanBtn');
const statusEl = document.getElementById('status');
const resultArea = document.getElementById('resultArea');
const deepScanEl = document.getElementById('deepScan');
const deepScanModelRow = document.getElementById('deepScanModelRow');
const deepScanModelEl = document.getElementById('deepScanModel');
const deepScanModelStatusEl = document.getElementById('deepScanModelStatus');

let modelsLoadedForKey = null;

async function loadDeepScanModels() {
  const apiKey = document.getElementById('apiKey').value;
  if (!apiKey || modelsLoadedForKey === apiKey) return;
  deepScanModelStatusEl.textContent = 'Đang tải danh sách model...';
  try {
    const res = await fetch('/api/v1/deep_scan/models', { headers: { 'X-API-Key': apiKey } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    while (deepScanModelEl.options.length > 1) deepScanModelEl.remove(1);
    for (const m of data.models) {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m === data.default_model ? `${m} (mặc định)` : m;
      deepScanModelEl.appendChild(opt);
    }
    modelsLoadedForKey = apiKey;
    if (data.status === 'skipped_no_key') {
      deepScanModelStatusEl.textContent = 'Server chưa cấu hình LANGEXTRACT_API_KEY — deep scan sẽ báo skipped_no_key.';
    } else if (data.status === 'skipped_error') {
      deepScanModelStatusEl.textContent = 'Không lấy được danh sách model từ Gemini — vẫn có thể dùng server default.';
    } else {
      deepScanModelStatusEl.textContent = `${data.models.length} model khả dụng · mặc định: ${data.default_model}`;
    }
  } catch (err) {
    deepScanModelStatusEl.textContent = 'Lỗi tải danh sách model: ' + err.message;
  }
}

deepScanEl.addEventListener('change', () => {
  deepScanModelRow.style.display = deepScanEl.checked ? 'block' : 'none';
  if (deepScanEl.checked) loadDeepScanModels();
});

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderHighlighted(text, entities) {
  const sorted = [...entities].sort((a, b) => a.location.start - b.location.start);
  let out = '';
  let cursor = 0;
  for (const e of sorted) {
    const { start, end } = e.location;
    if (start < cursor) continue;
    out += escapeHtml(text.slice(cursor, start));
    out += `<mark title="${e.entity_type} · score ${e.score.toFixed(2)}">${escapeHtml(text.slice(start, end))}</mark>`;
    cursor = end;
  }
  out += escapeHtml(text.slice(cursor));
  return out;
}

function renderTable(entities) {
  if (!entities.length) return '<p class="empty">Không phát hiện thực thể nhạy cảm nào.</p>';
  const rows = entities.map(e => `
    <tr>
      <td><span class="badge">${e.entity_type}</span></td>
      <td>${escapeHtml(e.text_val)}</td>
      <td class="${e.score >= 0.7 ? 'score-high' : 'score-low'}">${e.score.toFixed(2)}</td>
      <td>${e.location.start}-${e.location.end}</td>
    </tr>`).join('');
  return `<table>
    <thead><tr><th>Loại</th><th>Giá trị</th><th>Score</th><th>Vị trí</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

scanBtn.addEventListener('click', async () => {
  const text = document.getElementById('inputText').value;
  const apiKey = document.getElementById('apiKey').value;
  const anonymize = document.getElementById('anonymize').checked;
  const deepScan = deepScanEl.checked;
  const model = deepScanModelEl.value || undefined;
  statusEl.textContent = '';
  statusEl.className = '';

  if (!apiKey) {
    statusEl.textContent = 'Cần nhập X-API-Key (đăng ký qua POST /register).';
    statusEl.className = 'error';
    return;
  }
  if (!text.trim()) {
    statusEl.textContent = 'Chưa có văn bản để quét.';
    statusEl.className = 'error';
    return;
  }

  scanBtn.disabled = true;
  statusEl.textContent = 'Đang quét...';
  const t0 = performance.now();

  try {
    const res = await fetch('/api/v1/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
      body: JSON.stringify({ text, anonymize, deep_scan: deepScan, model })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.detail || `HTTP ${res.status}`);
    }
    const ms = Math.round(performance.now() - t0);
    let statusMsg = `Xong trong ${ms}ms · ${data.detected_entities.length} thực thể phát hiện.`;
    if (data.deep_scan_status) statusMsg += ` · deep_scan: ${data.deep_scan_status}`;
    statusEl.textContent = statusMsg;

    let html = `<div id="highlighted">${renderHighlighted(text, data.detected_entities)}</div>`;
    html += renderTable(data.detected_entities);
    if (anonymize && data.anonymized_content) {
      html += `<h2 style="margin-top:18px">Văn bản đã ẩn danh hoá</h2><div id="highlighted">${escapeHtml(data.anonymized_content.text)}</div>`;
    }
    resultArea.innerHTML = html;
    resultArea.className = '';
  } catch (err) {
    statusEl.textContent = 'Lỗi: ' + err.message;
    statusEl.className = 'error';
  } finally {
    scanBtn.disabled = false;
  }
});
</script>
</body>
</html>
