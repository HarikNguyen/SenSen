# SenSen custom recognizer registry — Presidio's native extension point.
# Add a category by adding a block below; no code changes needed.
# Schema verified against presidio_analyzer/conf/*.yaml in the installed package.

supported_languages:
  - en

global_regex_flags: 26  # re.IGNORECASE (2) | re.MULTILINE (8) | re.DOTALL (16)

recognizers:
  # ---- NLP-based NER (PERSON/ORGANIZATION/DATE via spaCy) — DISABLED.
  # en_core_web_sm has zero Vietnamese support: on real Vietnamese documents
  # it tagged ordinary phrase fragments ("một bên", "Ông/Bà") as PERSON/ORG,
  # and misclassified a real phone number and a national ID as DATE_TIME —
  # 0% precision in practice, confirmed on a real scanned contract. Disabled
  # rather than removed: an *absent* entry gets silently auto-re-added by
  # Presidio when an nlp_engine is configured; `enabled: false` is what
  # actually suppresses it. The nlp_engine itself keeps running regardless
  # (tokens/lemmas still feed every other recognizer's context scoring) —
  # this only stops the NER-sourced entities. See README roadmap for
  # restoring PERSON/ORG detection via a Vietnamese-aware model.
  - name: SpacyRecognizer
    type: predefined
    supported_languages:
      - en
    enabled: false

  # ---- Standard PII kept from Presidio's built-ins (curated subset, not the full list) ----
  - name: EmailRecognizer
    type: predefined
  - name: PhoneRecognizer
    type: predefined
    # Kept for US/GB/etc-format numbers. Presidio's own default region list
    # is (US, GB, DE, FR, IL, IN, CA, BR) — Vietnam isn't in it, so a bare
    # "0932843132" was never checked against a VN-shaped pattern. Tried
    # fixing via `supported_regions: [VN]` here first — doesn't work:
    # PhoneRecognizer has no dedicated Pydantic config with `extra="allow"`
    # (only HuggingFace/GLiNER/LangExtract recognizers do, see
    # input_validation/yaml_recognizer_models.py), so YAML validation
    # silently drops any constructor kwarg PhoneRecognizer's base config
    # doesn't already declare. VN numbers are covered by the dedicated
    # recognizer below instead.
  - name: UrlRecognizer
    type: predefined
  - name: IpRecognizer
    type: predefined
  - name: CreditCardRecognizer
    type: predefined
  - name: IbanRecognizer
    type: predefined
  - name: CryptoRecognizer
    type: predefined
  - name: MacAddressRecognizer
    type: predefined
  - name: UsSsnRecognizer
    type: predefined

  # ================================================================
  # CUSTOM ENTERPRISE CATEGORIES
  # ================================================================

  # A. Legal & Contractual
  - name: Contract ID Recognizer
    supported_language: "en"
    supported_entity: "CONTRACT_ID"
    patterns:
      - name: "contract id (strong, e.g. HD-2026-0142)"
        regex: "\\b(?:HD|H\\u0110|NDA)[-\\/][0-9]{4}[-\\/][A-Z0-9]{2,8}\\b"
        score: 0.75
      - name: "contract id (generic code, weak)"
        regex: "\\b[A-Z]{2,6}[-\\/]\\d{2,4}[-\\/][A-Z0-9]{2,10}\\b"
        score: 0.3
    # Context words are single tokens on purpose: Presidio matches per-lemma,
    # so multi-word phrases like "hợp đồng" never match. Ultra-generic
    # syllables (số, mã, đồng...) skipped to avoid over-boosting unrelated text.
    context:
      - "lục"
      - "luc"
      - "thuận"
      - "thuan"
      - "mật"
      - "mat"
      - "bồi"
      - "boi"
      - "contract"
      - "agreement"
      - "nda"
      - "clause"

  # B. Financial & Accounting (split into tax code + financial figure)
  - name: Vietnam Tax Code Recognizer
    supported_language: "en"
    supported_entity: "INTERNAL_TAX_CODE"
    patterns:
      # Excludes VN mobile prefixes (03/05/07/08/09) to avoid phone-number collisions.
      - name: "MST 10-digit (mobile-prefix excluded)"
        regex: "\\b0(?![35789])\\d{9}\\b|\\b[1-9]\\d{9}\\b"
        score: 0.25
      - name: "MST 13-digit (with branch suffix)"
        regex: "\\b\\d{10}-\\d{3}\\b"
        score: 0.4
    context:
      - "thuế"
      - "thue"
      - "mst"
      - "tax"
      - "code"
      - "doanh"
      - "nghiệp"
      - "nghiep"

  - name: Financial Metric Recognizer
    supported_language: "en"
    supported_entity: "FINANCIAL_METRIC"
    patterns:
      - name: "currency amount (VND/USD)"
        regex: "\\b[\\d]{1,3}(?:[.,]\\d{3})+(?:\\s?(?:VND|VNĐ|đ|USD))?\\b|\\$\\s?[\\d]{1,3}(?:[.,]\\d{3})*"
        score: 0.35
    context:
      - "lương"
      - "luong"
      - "nhuận"
      - "nhuan"
      - "phí"
      - "phi"
      - "ngân"
      - "ngan"
      - "phạt"
      - "phat"
      - "salary"
      - "revenue"
      - "budget"

  # C. HR & Workforce
  - name: Employee ID Recognizer
    supported_language: "en"
    supported_entity: "EMPLOYEE_ID"
    patterns:
      - name: "employee code NV-/EMP-/STAFF-"
        regex: "\\b(?:NV|EMP|STAFF)[-\\s]?\\d{3,8}\\b"
        score: 0.5
    context:
      - "nhân"
      - "nhan"
      - "chấm"
      - "cham"
      - "employee"
      - "performance"
      - "payroll"

  # D. Security & Infrastructure — patterns adapted from gitleaks' ruleset.
  - name: Infra Secret Recognizer
    supported_language: "en"
    supported_entity: "INFRA_SECRET"
    patterns:
      - name: "AWS access key id"
        regex: "\\bAKIA[0-9A-Z]{16}\\b"
        score: 0.9
      - name: "generic sk-style secret key"
        regex: "\\bsk-[A-Za-z0-9_-]{20,}\\b"
        score: 0.75
      - name: "JWT"
        regex: "\\beyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\b"
        score: 0.8
      - name: "database connection string"
        regex: "\\b(?:postgres(?:ql)?|mysql|mongodb(?:\\+srv)?|redis):\\/\\/[^\\s'\"]{5,}\\b"
        score: 0.85
      - name: "assigned secret/token/password (weak, needs context)"
        regex: "(?:api[_-]?key|secret|token|password|pwd)\\s*[:=]\\s*['\"]?[A-Za-z0-9\\-_.]{6,}['\"]?"
        score: 0.4
    context:
      - "secret"
      - "key"
      - "token"
      - "password"
      - "credential"
      - "connection"
      - "string"
      - "database"
      - "api"

  # E. Intellectual Property — low-confidence by design; flags markers for human
  # review, since regex can't detect trade secrets/source code directly.
  - name: IP Confidentiality Marker Recognizer
    supported_language: "en"
    supported_entity: "IP_SENSITIVE_MARKER"
    patterns:
      - name: "confidentiality marker"
        regex: "\\b(?:confidential|proprietary|trade secret|internal use only|bí mật kinh doanh|tài liệu mật|không phổ biến)\\b"
        score: 0.35
    context:
      - "source"
      - "code"
      - "design"
      - "doc"
      - "patent"
      - "quyền"
      - "quyen"
      - "hữu"
      - "huu"
      - "tuệ"
      - "tue"
      - "know-how"
      - "quyết"
      - "quyet"

  # F. Cryptographic material — PEM headers are near-zero false-positive.
  - name: Crypto Private Key Recognizer
    supported_language: "en"
    supported_entity: "CRYPTO_PRIVATE_KEY"
    patterns:
      - name: "PEM private key block"
        regex: "-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY(?: BLOCK)?-----"
        score: 0.95
    context:
      - "certificate"
      - "private"
      - "ssl"
      - "tls"
      - "key"

  # G. Internal network map — private ranges + CIDR (Presidio's built-in
  # IpRecognizer only matches single IPs, not subnets).
  - name: Infra Network Map Recognizer
    supported_language: "en"
    supported_entity: "INFRA_NETWORK_MAP"
    patterns:
      - name: "RFC1918 private IPv4 (optional CIDR)"
        regex: "\\b(?:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(?:1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3})(?:/\\d{1,2})?\\b"
        score: 0.55
      - name: "any IPv4/CIDR block"
        regex: "\\b(?:\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}\\b"
        score: 0.5
    context:
      - "server"
      - "subnet"
      - "vpc"
      - "gateway"
      - "router"
      - "mạng"
      - "mang"
      - "hạ"
      - "tầng"
      - "tang"
      - "firewall"
      - "network"

  # H. GPS coordinates — weak base score; decimal pairs are ambiguous without
  # context (same design as INTERNAL_TAX_CODE).
  - name: GPS Location Recognizer
    supported_language: "en"
    supported_entity: "GPS_LOCATION"
    patterns:
      - name: "decimal lat/long pair"
        regex: "-?\\b\\d{1,3}\\.\\d{4,8}\\b,\\s*-?\\b\\d{1,3}\\.\\d{4,8}\\b"
        score: 0.25
    context:
      - "toạ"
      - "toa"
      - "vĩ"
      - "vi"
      - "gps"
      - "location"
      - "lat"
      - "long"
      - "coordinates"

  # I. Financial credential — the PIN/password assignment, not the account
  # number alone (same collision risk as phone-vs-tax-code).
  - name: Financial Credential Recognizer
    supported_language: "en"
    supported_entity: "FINANCIAL_CREDENTIAL"
    patterns:
      - name: "assigned PIN/OTP/password (weak, needs banking context)"
        # .{0,60}? allows filler text between keyword and value (30 was too tight).
        regex: "(?:mật khẩu|mat khau|password|mã pin|ma pin|\\bpin\\b|mã otp|ma otp|\\botp\\b).{0,60}?(?:là\\s*[:]?|[:=])\\s*['\"]?[A-Za-z0-9]{4,12}['\"]?"
        score: 0.4
    context:
      - "ngân"
      - "ngan"
      - "hàng"
      - "hang"
      - "tài"
      - "tai"
      - "khoản"
      - "khoan"
      - "thẻ"
      - "the"
      - "stk"
      - "banking"
      - "account"
      - "card"

  # J. Vietnamese national ID (CCCD, current 12-digit format per Thông tư
  # 07/2016/TT-BCA): 3-digit province code + 1 digit encoding century/gender
  # (0/1 = born 1900s male/female, 2/3 = born 2000s) + 2-digit birth year +
  # 6 random digits. The [0-3] constraint is real structure, not a guess —
  # it's what rules out most random 12-digit strings. Old 9-digit CMND
  # format is out of scope (current format only).
  - name: Vietnam National ID Recognizer
    supported_language: "en"
    supported_entity: "VN_NATIONAL_ID"
    patterns:
      - name: "CCCD 12-digit (century/gender digit constrained)"
        regex: "\\b\\d{3}[0-3]\\d{8}\\b"
        score: 0.4
    context:
      - "căn"
      - "cước"
      - "cccd"
      - "cmnd"
      - "cmtnd"
      - "định"
      - "danh"

  # K. Vietnamese phone number — mobile numbering plan: leading 0 (local) or
  # +84/0084 (international), then one of the 5 real mobile prefixes
  # (3/5/7/8/9), then 8 more digits = 9 significant digits either way. Emits
  # the standard PHONE_NUMBER entity (not a VN-specific type) since it's
  # still fundamentally a phone number, just detected via a VN-specific
  # pattern instead of Presidio's built-in PhoneRecognizer above.
  - name: Vietnam Phone Recognizer
    supported_language: "en"
    supported_entity: "PHONE_NUMBER"
    patterns:
      - name: "VN mobile, local format (0 + prefix + 8 digits)"
        regex: "\\b0[35789]\\d{8}\\b"
        score: 0.75
      - name: "VN mobile, international format (+84/0084 + prefix + 8 digits)"
        regex: "(?:\\+84|0084)[35789]\\d{8}\\b"
        score: 0.75
    context:
      - "điện"
      - "thoại"
      - "sđt"
      - "phone"
      - "mobile"
      - "call"
